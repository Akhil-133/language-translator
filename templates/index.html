<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translator</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <!-- Heading -->
        <h1 class="text-center mb-2">
            🌐 Language Translator
        </h1>

        <p class="text-center text-muted mb-4">
            Translate text between multiple languages
        </p>

        <!-- Translation Form -->
        <form method="POST">

            <!-- Text Input -->
            <label for="text" class="form-label">
                Enter your text
            </label>

            <textarea
                name="text"
                id="text"
                class="form-control mb-1"
                rows="6"
                maxlength="500"
                placeholder="Enter your text here..."
                required
                oninput="updateCharacterCount()">{{ request.form.get('text', '') }}</textarea>

            <!-- Character Counter -->
            <div class="text-end text-muted mb-3">
                <small>
                    Characters:
                    <span id="charCount">0</span> / 500
                </small>
            </div>

            <!-- Language Selection -->
            <div class="row align-items-end">

                <!-- Source Language -->
                <div class="col-md-5 mb-3">

                    <label for="source" class="form-label">
                        From
                    </label>

                    <select
                        name="source"
                        id="source"
                        class="form-select">

                        {% for name, code in languages.items() %}

                        <option
                            value="{{ code }}"
                            {% if request.form.get('source', 'en') == code %}selected{% endif %}>
                            {{ name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

                <!-- Swap Button -->
                <div class="col-md-2 mb-3 text-center">

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        onclick="swapLanguages()">
                        ⇄ Swap
                    </button>

                </div>

                <!-- Target Language -->
                <div class="col-md-5 mb-3">

                    <label for="target" class="form-label">
                        Translate To
                    </label>

                    <select
                        name="target"
                        id="target"
                        class="form-select">

                        {% for name, code in languages.items() %}

                        <option
                            value="{{ code }}"
                            {% if request.form.get('target', 'te') == code %}selected{% endif %}>
                            {{ name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>

            </div>

            <!-- Action Buttons -->
            <div class="d-flex gap-2">

                <button
                    type="submit"
                    id="translateButton"
                    class="btn btn-primary flex-grow-1">
                    Translate
                </button>

                <button
                    type="button"
                    class="btn btn-outline-secondary"
                    onclick="clearText()">
                    Clear
                </button>

            </div>

        </form>

        <!-- Translation Result -->
        {% if translated_text %}

        <div class="result-box mt-4">

            <h5>Translation</h5>

            <p class="mb-3" id="translationText">
                {{ translated_text }}
            </p>

            <button
                type="button"
                class="btn btn-outline-primary btn-sm"
                onclick="copyTranslation()">
                📋 Copy Translation
            </button>

        </div>

        {% endif %}

        <!-- Error Message -->
        {% if error %}

        <div class="alert alert-danger mt-4">
            {{ error }}
        </div>

        {% endif %}

    </div>

</div>

<!-- JavaScript -->
<script>

    // Swap source and target languages
    function swapLanguages() {

        const source = document.getElementById("source");
        const target = document.getElementById("target");

        const temporary = source.value;

        source.value = target.value;
        target.value = temporary;
    }


    // Clear text input
    function clearText() {

        document.getElementById("text").value = "";
        document.getElementById("charCount").textContent = "0";
    }


    // Update character counter
    function updateCharacterCount() {

        const textArea = document.getElementById("text");
        const charCount = document.getElementById("charCount");

        charCount.textContent = textArea.value.length;
    }


    // Show loading message when translating
    document.querySelector("form").addEventListener("submit", function () {

        const button = document.getElementById("translateButton");

        button.textContent = "⏳ Translating...";
        button.disabled = true;
    });


    // Copy translation
    function copyTranslation() {

        const translation =
            document.getElementById("translationText").textContent.trim();

        navigator.clipboard.writeText(translation).then(function () {

            alert("Translation copied!");

        });
    }


    // Initialize character counter
    updateCharacterCount();

</script>

</body>
</html>
